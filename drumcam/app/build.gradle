plugins {
    id "com.android.application"
}

// A chave de assinatura fica fora do repositório: o caminho e as senhas vêm de assinatura.properties (não versionado)
// ou das variáveis DRUMCAM_KEYSTORE, DRUMCAM_KEYSTORE_SENHA, DRUMCAM_KEY_ALIAS e DRUMCAM_KEY_SENHA.
def assinatura = new Properties()
def arquivoAssinatura = rootProject.file("assinatura.properties")
if (arquivoAssinatura.exists()) arquivoAssinatura.withInputStream { assinatura.load(it) }
def valor = { String chave, String variavel -> assinatura.getProperty(chave) ?: System.getenv(variavel) }

android {
    namespace "br.com.nordtool.drumcam"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.nordtool.drumcam"
        // Android 5.0: o celular antigo que fica parado como câmera pode ser bem velho.
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def loja = valor("storeFile", "DRUMCAM_KEYSTORE")
            if (loja) {
                storeFile file(loja)
                storePassword valor("storePassword", "DRUMCAM_KEYSTORE_SENHA")
                keyAlias valor("keyAlias", "DRUMCAM_KEY_ALIAS")
                keyPassword valor("keyPassword", "DRUMCAM_KEY_SENHA")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (valor("storeFile", "DRUMCAM_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
